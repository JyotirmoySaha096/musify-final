version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify_secret
      POSTGRES_DB: spotify_clone
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gateway-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ${HOME}/server/musify.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=spotify
      - DB_PASSWORD=spotify_secret
      - DB_DATABASE=spotify_clone
    depends_on:
      - db
    networks:
      - gateway-net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/musify-api
    depends_on:
      - api
    networks:
      - gateway-net

volumes:
  pgdata:

networks:
  gateway-net:
    external: true
