name: Deploy Musify to Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Build and Deploy with Docker Compose
        run: |
          docker compose -p musify-final up --build -d --remove-orphans
          
      - name: Run Database Migrations
        run: |
          # Wait 5 seconds to ensure DB and API are fully initialized
          sleep 5
          docker exec musify-final-api-1 npm run db:migrate || echo "Migration skipped or failed"

      - name: Clean up old Docker images
        run: |
          docker image prune -f
