name: Deploy Musify to Pi

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/musify-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/musify-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./backend
            image: ${{ github.repository_owner }}/musify-api
          - service: web
            context: ./frontend
            image: ${{ github.repository_owner }}/musify-web
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Downcase image name
        run: echo "LOWERCASE_IMAGE=$(echo ${{ matrix.image }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Inject frontend feature flags for build time (Web only)
        if: matrix.service == 'web'
        run: |
          echo "NEXT_PUBLIC_ENABLE_MICROSOFT_SSO=false" > ./frontend/.env.production
          echo "NEXT_PUBLIC_ENABLE_FACEBOOK_SSO=false" >> ./frontend/.env.production
          echo "NEXT_PUBLIC_ENABLE_APPLE_SSO=false" >> ./frontend/.env.production

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.LOWERCASE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Downcase image names
        run: |
          echo "LOWERCASE_API_IMAGE=$(echo ${{ env.API_IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "LOWERCASE_WEB_IMAGE=$(echo ${{ env.WEB_IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry (Pi)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker images
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.LOWERCASE_API_IMAGE }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.LOWERCASE_WEB_IMAGE }}:latest

      - name: Create docker-compose.prod.yml
        run: |
          cat << INNER_EOF > docker-compose.prod.yml
          version: '3.8'
          services:
            api:
              image: ${{ env.REGISTRY }}/${{ env.LOWERCASE_API_IMAGE }}:latest
            web:
              image: ${{ env.REGISTRY }}/${{ env.LOWERCASE_WEB_IMAGE }}:latest
          INNER_EOF

      - name: Deploy with Docker Compose
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -p musify-final up -d --remove-orphans
          
      - name: Run Database Migrations
        run: |
          sleep 5
          docker exec musify-final-api-1 npm run db:migrate || echo "Migration skipped or failed"

      - name: Clean up old Docker images
        run: |
          docker image prune -f
